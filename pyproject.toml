[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circulation-pump-tool"
version = "0.1.0"
description = "Bench control and duty-cycle scripting for EMP circulation pumps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-can>=4.0"]

[project.scripts]
circulationpump = "circulationpump.cli:main"

[tool.setuptools.package-data]
circulationpump = ["static/*", "cycle.example.json"]